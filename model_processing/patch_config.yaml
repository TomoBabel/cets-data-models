discriminated_fields:
  - field_name: annotations
    for_classes:
      - Region
    discriminator: annotation_type
    union_types:
      - SegmentationMask2D
      - SegmentationMask3D
      - ProbabilityMap2D
      - ProbabilityMap3D
      - PointSet2D
      - PointSet3D
      - PointVectorSet2D
      - PointVectorSet3D
      - PointMatrixSet2D
      - PointMatrixSet3D
      - TriMesh
      - SphereSet
      - CircleSet
      - CylinderSet
      - CuboidSet
      - BoxSet
      - Spline2D
      - Spline3D
      - DensityMap
  - field_name: coordinate_transformations
    discriminator: transformation_type
    union_types:
      - Identity
      - MapAxis
      - Translation
      - Scale
      - Affine
      - Rot90
      - Reflection
      - ProjectAxis
      - Sequence
  - field_name: sequence
    for_classes:
      - Sequence
    discriminator: transformation_type
    union_types:
      - Identity
      - MapAxis
      - Translation
      - Scale
      - Affine
      - Rot90
      - Reflection
      - ProjectAxis

type_aliases:
  - name: Vector2D
    definition: "Annotated[list[float], Field(min_length=2, max_length=2)]"
    for_field: 
      as_list:
        - origin2D
        - vector2D
  - name: Vector3D
    definition: "Annotated[list[float], Field(min_length=3, max_length=3)]"
    for_field: 
      as_list:
        - origin3D
        - vector3D
  - name: Matrix2x2
    definition: "Annotated[list[Vector2D], Field(min_length=2, max_length=2)]"
    for_field: 
      as_list:
        - matrix2D
  - name: Matrix3x3
    definition: "Annotated[list[Vector3D], Field(min_length=3, max_length=3)]"
    for_field: 
      as_list:
        - matrix3D
  - name: Radii
    definition: "Annotated[list[float], Field(min_length=1)]"
    for_field:
      as_single:
        - radii
  - name: Dimensions2D
    definition: "Annotated[list[float], Field(min_length=2, max_length=2)]"
    for_field:
      as_list: 
        - dimensions2D
  - name: Dimensions3D
    definition: "Annotated[list[float], Field(min_length=3, max_length=3)]"
    for_field:
      as_list:
        - dimensions3D

# Hand-written mixin base classes injected into generated classes at generation
# time (see model_processing/generate_models.py). Each `mixin` is prepended to
# the bases of every class in `into`, and imported from `import_from`.
injected_base_classes:
  - mixin: ArrayAxisUnitMixin
    import_from: cets_data_model.models.axis
    into:
      - Axis
  - mixin: AffineValidationMixin
    import_from: cets_data_model.models.affine
    into:
      - Affine
  - mixin: Rot90ValidationMixin
    import_from: cets_data_model.models.transforms
    into:
      - Rot90
  - mixin: ReflectionValidationMixin
    import_from: cets_data_model.models.transforms
    into:
      - Reflection
  - mixin: ScaleValidationMixin
    import_from: cets_data_model.models.transforms
    into:
      - Scale
  - mixin: ProjectAxisValidationMixin
    import_from: cets_data_model.models.transforms
    into:
      - ProjectAxis
  - mixin: TransformContextMixin
    import_from: cets_data_model.models.transforms
    into:
      - Image2D
      - Image3D
      - CoordMetaMixin
