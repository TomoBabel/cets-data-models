name: CETMDCoordTransforms
id: https://w3id.org/cetmd/coord_transforms
version: 0.0.1
description: Schema for cryoET alignments
prefixes:
  linkml: https://w3id.org/linkml/
  coord_transforms: https://w3id.org/cetmd/coord_transforms/

default_prefix: coord_transforms

imports:
- linkml:types
- ./coordinate_systems
- ./common

slots:
  transformation_type:
    description: The type of transformation.
    range: TransformationType
    required: true

classes:
  CoordinateTransformation:
    description: A coordinate transformation
    slots:
      - transformation_type
      - name
    # `name` stays free-form: transformations include per-instance (per-tilt) and
    # intermediate steps outside the canonical set listed by TransformationName.
    attributes:
      input:
        description: The source coordinate system name
        range: string
      output:
        description: The target coordinate system name
        range: string
  Identity:
    description: The identity transformation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(identity)
  AxisNameMapping:
    description: Axis name to Axis name mapping
    attributes:
      axis1_name:
        description: The type of transformation
        range: string
      axis2_name:
        description: The mapping of the axis names
        range: string
  MapAxis:
    description: Axis permutation transformation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(map_axis)
    attributes:
      map_axis:
        description: The permutation of the axes
        range: AxisNameMapping
        inlined: true
        multivalued: true
  Translation:
    description: A translation transformation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(translation)
    attributes:
      translation:
        description: The translation vector
        range: float
        multivalued: true
  Scale:
    description: A scaling transformation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(scale)
    attributes:
      scale:
        description: >-
          The scale factor along each axis. Factors are finite and strictly
          positive; a reversed axis is expressed with Reflection.
        range: float
        multivalued: true
  Affine:
    description: >-
      A general linear transformation in two or three dimensions: the linear
      part of an affine map, without translation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(affine)
    attributes:
      affine:
        description: >-
          The matrix of a linear map, stored as a list of rows: 2x2 for a 2D
          transformation, 3x3 for a 3D transformation. It acts on column
          vectors: entry [i][j] is the contribution of input axis j to output
          axis i, with axes in their declared order. The matrix carries no
          translation; a shift is a separate Translation step, so that its
          order relative to the matrix is explicit in the Sequence. All entries
          are finite. A 3x3 matrix is always a 3D transformation; a 2D
          transformation that was stored as a 3x3 homogeneous matrix is written
          as its 2x2 block and a Translation.
        comments:
          - >-
            OME-Zarr 0.6 stores an affine as the linear block with the
            translation column appended. The two forms convert by appending or
            splitting that column.
          - >-
            The Python models check the matrix size against input and output
            coordinate systems declared on the same image or annotation.
        # Exact shapes live in any_of. LinkML 1.11.1 ignores array alternatives;
        # model_processing/generate_models.py compiles them into the models.
        range: float
        array:
          exact_number_dimensions: 2
        any_of:
          - array:
              exact_number_dimensions: 2
              dimensions:
                - exact_cardinality: 2
                - exact_cardinality: 2
          - array:
              exact_number_dimensions: 2
              dimensions:
                - exact_cardinality: 3
                - exact_cardinality: 3
  Rot90:
    description: >-
      A rotation by quarter turns about coordinate axes, in two or three
      dimensions
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(rot90)
    attributes:
      rot90:
        description: >-
          An integer matrix stored as a list of rows, with the same layout as
          an affine matrix: 2x2 for a 2D rotation, 3x3 for a 3D rotation. Each
          row and each column has exactly one nonzero entry, 1 or -1, and the
          determinant is +1. The rotation is about the coordinate origin and
          carries no translation.
        comments:
          - >-
            A mirror image (determinant -1) is expressed with Reflection, and a
            rotation by any other angle with Affine.
        # Same shape alternatives as Affine.affine; see the comment there.
        range: integer
        required: true
        array:
          exact_number_dimensions: 2
        any_of:
          - array:
              exact_number_dimensions: 2
              dimensions:
                - exact_cardinality: 2
                - exact_cardinality: 2
          - array:
              exact_number_dimensions: 2
              dimensions:
                - exact_cardinality: 3
                - exact_cardinality: 3
  Reflection:
    description: A reflection that negates the coordinates along one or more axes
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(reflection)
    attributes:
      axes:
        description: >-
          The axes whose coordinates are negated, each listed once. Axes are
          named by position: x is the first axis of the coordinate system, y the
          second and z the third. The reflection is about the origin, and the
          coordinates along the other axes are unchanged.
        range: ReflectionAxis
        required: true
        multivalued: true
        minimum_cardinality: 1
  ProjectAxis:
    description: >-
      A change in the number of axes, by dropping input axes and creating
      output axes at given positions
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(project_axis)
    attributes:
      dropped_inputs:
        description: >-
          Positions of the input axes that are dropped, counted from 0, each
          listed once.
        range: integer
        multivalued: true
      created_outputs:
        description: >-
          Positions of the output axes that are created, counted from 0, each
          listed once. Their coordinate is 0. The other output positions take
          the kept input axes in their order, so the output has as many axes as
          the input, minus the dropped and plus the created ones.
        range: integer
        multivalued: true
    comments:
      - >-
        OME-Zarr 0.6 projectAxis, with droppedInputs and createdOutputs. A
        transformation that drops an axis is not invertible.
  Sequence:
    description: A sequence of transformations
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(sequence)
    attributes:
      sequence:
        description: The sequence of transformations
        range: CoordinateTransformation
        multivalued: true

enums:
  TransformationType:
    permissible_values:
      identity:
        description: The identity transformation.
      map_axis:
        description: Axis permutation transformation
      translation:
        description: A translation transformation.
      scale:
        description: A scaling transformation.
      affine:
        description: An affine transformation.
      rot90:
        description: A rotation by quarter turns about coordinate axes.
      reflection:
        description: A reflection along one or more axes.
      project_axis:
        description: A change in the number of axes by dropping and creating axes.
      sequence:
        description: A sequence of transformations.
      projection_alignment:
        description: A sequence specific to projection alignments.
  ReflectionAxis:
    description: An axis named by its position in a coordinate system.
    permissible_values:
      x:
        description: The first axis.
      y:
        description: The second axis.
      z:
        description: The third axis.
  TransformationName:
    description: Canonical names for the standard transformations.
    permissible_values:
      array_to_physical:
        description: An entity's array (pixel) space to its physical space.
      calibration_to_movie_frame:
        description: Calibration image to movie frame.
      movie_frame_to_projection:
        description: Movie frame to projection.
      sub_projection_to_projection:
        description: Sub-projection to projection.
      annotation_to_tomogram:
        description: Annotation to tomogram.
      subtomogram_to_tomogram:
        description: Subtomogram to tomogram.
      particle_map_to_subtomogram:
        description: Particle map to subtomogram.
      particle_map_to_tomogram:
        description: Particle map to tomogram (derived composition).
      tomogram_to_projection:
        description: Tomogram to projection (the tomographic projection, per tilt).
