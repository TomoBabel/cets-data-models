name: CETMDCoordTransforms
id: https://w3id.org/cetmd/coord_transforms
version: 0.0.1
description: Schema for cryoET alignments
prefixes:
  linkml: https://w3id.org/linkml/
  coord_transforms: https://w3id.org/cetmd/coord_transforms/

default_prefix: coord_transforms

imports:
- linkml:types
- ./coordinate_systems
- ./common

slots:
  transformation_type:
    description: The type of transformation.
    range: TransformationType
    required: true

classes:
  CoordinateTransformation:
    description: A coordinate transformation
    slots:
      - transformation_type
      - name
    attributes:
      input:
        description: The source coordinate system name
        range: string
      output:
        description: The target coordinate system name
        range: string
  Identity:
    description: The identity transformation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(identity)
  AxisNameMapping:
    description: Axis name to Axis name mapping
    attributes:
      axis1_name:
        description: The type of transformation
        range: string
      axis2_name:
        description: The mapping of the axis names
        range: string
  MapAxis:
    description: Axis permutation transformation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(map_axis)
    attributes:
      map_axis:
        description: The permutation of the axes
        range: AxisNameMapping
        inlined: true
        multivalued: true
  Translation:
    description: A translation transformation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(translation)
    attributes:
      translation:
        description: The translation vector
        range: float
        multivalued: true
  Scale:
    description: A scaling transformation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(scale)
    attributes:
      scale:
        description: The scaling vector
        range: float
        multivalued: true
  Affine:
    description: >-
      A general linear transformation in two or three dimensions: the linear
      part of an affine map, without translation
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(affine)
    attributes:
      affine:
        description: >-
          The matrix of a linear map, stored as a list of rows: 2x2 for a 2D
          transformation, 3x3 for a 3D transformation. It acts on column
          vectors: entry [i][j] is the contribution of input axis j to output
          axis i, with axes in their declared order. The matrix carries no
          translation; a shift is a separate Translation step, so that its
          order relative to the matrix is explicit in the Sequence. All entries
          are finite. A 3x3 matrix is always a 3D transformation; a 2D
          transformation that was stored as a 3x3 homogeneous matrix is written
          as its 2x2 block and a Translation.
        comments:
          - >-
            OME-Zarr 0.6 stores an affine as the linear block with the
            translation column appended. The two forms convert by appending or
            splitting that column.
          - >-
            The Python models check the matrix size against input and output
            coordinate systems declared on the same image or annotation.
        # Exact shapes live in any_of. LinkML 1.11.1 ignores array alternatives;
        # model_processing/generate_models.py compiles them into the models.
        range: float
        array:
          exact_number_dimensions: 2
        any_of:
          - array:
              exact_number_dimensions: 2
              dimensions:
                - exact_cardinality: 2
                - exact_cardinality: 2
          - array:
              exact_number_dimensions: 2
              dimensions:
                - exact_cardinality: 3
                - exact_cardinality: 3
  Sequence:
    description: A sequence of transformations
    is_a: CoordinateTransformation
    slot_usage:
      transformation_type:
        ifabsent: TransformationType(sequence)
    attributes:
      sequence:
        description: The sequence of transformations
        range: CoordinateTransformation
        multivalued: true

enums:
  TransformationType:
    permissible_values:
      identity:
        description: The identity transformation.
      map_axis:
        description: Axis permutation transformation
      translation:
        description: A translation transformation.
      scale:
        description: A scaling transformation.
      affine:
        description: An affine transformation.
      sequence:
        description: A sequence of transformations.
      projection_alignment:
        description: A sequence specific to projection alignments.