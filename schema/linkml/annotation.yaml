name: CETMDAnnotation
id: https://w3id.org/cetmd/annotation
version: 0.0.1
description: Schema for cryoET annotations
prefixes:
  linkml: https://w3id.org/linkml/
  image: https://w3id.org/cetmd/image/
  annotation: https://w3id.org/cetmd/annotation/

default_prefix: annotation

imports:
- linkml:types
- ./common
- ./image
- ./coordinate_systems
- ./coordinate_transforms

slots:
  - annotation_type:
      description: The type of annotation.
      range: AnnotationType
      required: true
  - source_tomogram_id:
      description: ID of the tomogram from which this annotation was derived, such as the tomogram containing picked coordinates.
      range: string
  - origin2D:
      description: Location on a 2D image (Nx2).
      range: float
      array:
        exact_number_dimensions: 2
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xy
            exact_cardinality: 2
  - translation2D:
      description: Offset from the origin of a point on a 2D image (Nx2).
      range: float
      array:
        exact_number_dimensions: 2
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xy
            exact_cardinality: 2
  - vector2D:
      description: Orientation vector associated with a point on a 2D image (Nx2).
      range: float
      array:
        exact_number_dimensions: 2
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xy
            exact_cardinality: 2
  - matrix2D:
      description: Rotation matrix associated with a point on a 2D image (Nx2x2).
      range: float
      array:
        exact_number_dimensions: 3
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xy
            exact_cardinality: 2
          - alias: xy
            exact_cardinality: 2
  - origin3D:
      description: Location on a 3D image (Nx3).
      range: float
      array:
        exact_number_dimensions: 2
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xyz
            exact_cardinality: 3
  - translation3D:
      description: Offset from the origin of a point on a 3D image (Nx3).
      range: float
      array:
        exact_number_dimensions: 2
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xyz
            exact_cardinality: 3
  - vector3D:
      description: Orientation vector associated with a point on a 3D image (Nx3).
      range: float
      array:
        exact_number_dimensions: 2
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xyz
            exact_cardinality: 3
  - matrix3D:
      description: Rotation matrix associated with a point on a 3D image (Nx3x3).
      range: float
      array:
        exact_number_dimensions: 3
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xyz
            exact_cardinality: 3
          - alias: xyz
            exact_cardinality: 3
  - radii:
      description: Radii of circles, spheres, or cylinders (N).
      range: float
      array:
        exact_number_dimensions: 1
        dimensions:
          - alias: N
            minimum_cardinality: 1
  - dimensions2D:
      description: Dimensions of 2D objects (x, y).
      range: float
      array:
        exact_number_dimensions: 2
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xy
            minimum_cardinality: 2
  - dimensions3D:
      description: Dimensions of 3D objects (x, y, z).
      range: float
      array:
        exact_number_dimensions: 2
        dimensions:
          - alias: N
            minimum_cardinality: 1
          - alias: xyz
            minimum_cardinality: 3
  - instance_ids:
      description: >-
        Instance identifier of each point (N), aligned with the point coordinates (the i-th id
        belongs to the i-th point, so it must have the same length). Points sharing an id belong
        to the same object instance (e.g. the same membrane or filament). When absent, all the
        points belong to a single instance.
      range: integer
      array:
        exact_number_dimensions: 1
        dimensions:
          - alias: N
            minimum_cardinality: 1
  - annotated_object:
      description: The biological object or structure represented by this annotation, e.g. membrane or microtubule.
      range: AnnotatedObject
      inlined: true
  - derived_from_annotation_id:
      description: >-
        ID of the annotation, in the same region, this annotation was derived from, e.g. the
        segmentation mask a skeleton or an instance segmentation was computed from.
      range: string
  - feature_type:
      description: >-
        Kind of biological object or feature that is segmented, e.g. membrane or microtubule.
        Objects without a specific value are annotated as other, described in name.
      range: SegmentedFeatureType
  - description:
      description: A free-text description of this entity.
      range: string
  - label_value:
      description: Voxel/pixel value of a segmentation mask.
      range: integer
      required: true
  - labels:
      description: >-
        Meaning of the values of a segmentation mask. For semantic segmentations, one entry per
        segmented class. For instance segmentations it can be omitted, every non-background value
        being an instance of the annotated_object. Values not listed (typically 0) are background.
      range: SegmentationLabel
      multivalued: true
      inlined_as_list: true
  - segmentation_type:
      description: Whether the values of a segmentation mask are classes (semantic) or object instances (instance).
      range: SegmentationType
  - value_type:
      description: Kind of values stored in a probability map.
      range: ProbabilityMapValueType
  - threshold:
      description: Value above which a pixel/voxel of a probability map was considered part of the annotated object (foreground).
      range: float

classes:
  CoordMetaMixin:
    description: Coordinate system mixins for annotations.
    slots:
      - coordinate_systems
      - coordinate_transformations

  AssociatedFile:
    description: File associated with this annotation
    slots:
      - path

  AnnotatedObject:
    description: >-
      A biological object or structure that is annotated, e.g. membacquistionrane, microtubule or actin.
    slots:
      - feature_type
      - name
      - description
    slot_usage:
      feature_type:
        required: true

  SegmentationLabel:
    description: The meaning of one value of a segmentation mask.
    slots:
      - label_value
      - annotated_object
    slot_usage:
      annotated_object:
        required: true

  Annotation:
    description: A primitive annotation.
    slots:
      - id
      - annotation_type
      - name
      - source_tomogram_id
      - annotated_object
      - derived_from_annotation_id
  SegmentationMask2D:
    is_a: Annotation
    mixins:
      - Image2D
      - AssociatedFile
    description: An annotation image with categorical labels.
    slots:
      - segmentation_type
      - labels
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(segmentation_mask_2D)
  SegmentationMask3D:
    is_a: Annotation
    mixins:
      - Image3D
      - AssociatedFile
    description: An annotation volume with categorical labels.
    slots:
      - segmentation_type
      - labels
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(segmentation_mask_3D)
  ProbabilityMap2D:
    is_a: Annotation
    mixins:
      - Image2D
      - AssociatedFile
    description: An annotation image with real-valued labels.
    slots:
      - value_type
      - threshold
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(probability_map_2D)
  ProbabilityMap3D:
    is_a: Annotation
    mixins:
      - Image3D
      - AssociatedFile
    description: An annotation volume with real-valued labels.
    slots:
      - value_type
      - threshold
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(probability_map_3D)
  PointSet2D:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of 2D point annotations, optionally grouped into object instances.
    slots:
      - origin2D
      - instance_ids
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(point_set_2D)
  PointSet3D:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: >-
      A set of 3D point annotations, optionally grouped into object instances (e.g. the points
      of each segmented membrane).
    slots:
      - origin3D
      - instance_ids
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(point_set_3D)
  PointVectorSet2D:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of 2D points with an associated direction vector.
    slots:
      - origin2D
      - vector2D
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(point_vector_set_2D)
  PointVectorSet3D:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of 3D points with an associated direction vector.
    slots:
      - origin3D
      - vector3D
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(point_vector_set_3D)
  PointMatrixSet2D:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of 2D points with an associated rotation matrix.
    slots:
      - origin2D
      - matrix2D
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(point_matrix_set_2D)
  PointMatrixSet3D:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of 3D points with an associated rotation matrix.
    slots:
      - origin3D
      - matrix3D
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(point_matrix_set_3D)
  TriMesh:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A mesh annotation.
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(tri_mesh)

  SphereSet:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of spheres.
    slots:
      - origin3D
      - radii
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(sphere_set)

  CircleSet:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of circles.
    slots:
      - origin2D
      - radii
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(circle_set)

  CylinderSet:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of cylinders,
    slots:
      - vector3D
      - radii
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(cylinder_set)

  CuboidSet:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of oriented 3D boxes.
    slots:
      - origin3D
      - matrix3D
      - dimensions3D
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(cuboid_set)

  BoxSet:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: A set of 2D boxes.
    slots:
      - origin2D
      - matrix2D
      - dimensions2D
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(box_set)

  Spline2D:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: >-
      A 2D spline, given by its ordered points. With instance_ids, a set of splines: the points
      sharing an id, in order, form one spline.
    slots:
      - origin2D
      - instance_ids
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(spline_2D)

  Spline3D:
    is_a: Annotation
    mixins:
      - CoordMetaMixin
    description: >-
      A 3D spline, given by its ordered points. With instance_ids, a set of splines (e.g.
      filaments): the points sharing an id, in order, form one spline.
    slots:
      - origin3D
      - instance_ids
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(spline_3D)

  DensityMap:
    is_a: Annotation
    mixins:
      - Image3D
      - AssociatedFile
    description: A density map fit into a volume.
    slots:
      - matrix3D
    slot_usage:
      annotation_type:
        ifabsent: AnnotationType(density_map)

enums:
  AnnotationType:
    permissible_values:
      segmentation_mask_2D:
        description: An annotation image with categorical labels.
      segmentation_mask_3D:
        description: An annotation volume with categorical labels.
      probability_map_2D:
        description: An annotation image with real-valued labels.
      probability_map_3D:
        description: An annotation volume with real-valued labels.
      point_set_2D:
        description: A set of 2D point annotations.
      point_set_3D:
        description: A set of 3D point annotations.
      point_vector_set_2D:
        description: A set of 2D points with an associated direction vector.
      point_vector_set_3D:
        description: A set of 3D points with an associated direction vector.
      point_matrix_set_2D:
        description: A set of 2D points with an associated rotation matrix.
      point_matrix_set_3D: 
        description: A set of 3D points with an associated rotation matrix.
      tri_mesh:
        description: A mesh annotation.
      sphere_set:
        description: A set of spheres.
      circle_set:
        description: A set of circles.
      cylinder_set:
        description: A set of cylinders.
      cuboid_set:
        description: A set of oriented 3D boxes.
      box_set:
        description: A set of 2D boxes.
      spline_2D:
        description: A 2D spline.
      spline_3D:
        description: A 3D spline.
      density_map:
        description: A density map fit into a volume.
  SegmentationType:
    description: How the values of a segmentation mask are to be interpreted.
    permissible_values:
      semantic:
        description: Each value is a class; all the pixels/voxels of a class share the same value.
      instance:
        description: Each non-background value is a distinct object instance (e.g. labelled connected components).
  ProbabilityMapValueType:
    description: Kind of values stored in a probability map.
    permissible_values:
      probability:
        description: Probabilities in the range [0, 1].
      logit:
        description: Unbounded logits (raw network outputs before the sigmoid/softmax).
      score:
        description: Any other real-valued score.
  SegmentedFeatureType:
    description: >-
      Biological objects or features that can be segmented. New values can be added without
      affecting the existing ones; objects not covered yet are annotated as other.
    permissible_values:
      membrane:
        description: A lipid bilayer membrane.
      microtubule:
        description: A microtubule.
      actin_filament:
        description: An actin filament (F-actin).
      filament:
        description: A cytoskeletal filament of unspecified type.
      other:
        description: Any other object or feature, described in the name of the annotated object.
