name: CETMDImageEntities
id: https://w3id.org/cetmd/imageentities
version: 0.0.1
description: Schema for cryoET alignments
prefixes:
  linkml: https://w3id.org/linkml/
  image_entities: https://w3id.org/cetmd/imageentities/
  oscem: https://w3id.org/osc-em/
default_prefix: image_entities
imports:
- linkml:types
- ./image
- ./coordinate_systems
- ./coordinate_transforms
- ./alignment
- ./common
slots:
  section:
    description: 0-based section index to the entity inside a stack.
    range: integer
  nominal_tilt_angle:
    description: The tilt angle reported by the microscope
    range: float
  accumulated_dose:
    description: The pre-exposure up to this image in e-/A^2
    range: float
  defocus_u:
    description: Estimated defocus U for this image in Angstrom, underfocus positive.
    range: float
  defocus_v:
    description: Estimated defocus V for this image in Angstrom, underfocus positive.
    range: float
  defocus_angle:
    description: 'Estimated angle of astigmatism. Unit: degrees.'
    range: float
  phase_shift:
    description: 'Phase shift value produced by the usage of a phase plate. Unit: degrees.'
    range: float
  exposure_time:
    description: Total exposure time per movie/record in seconds.
    range: float
    aliases:
    - Exposure_Time
    exact_mappings:
    - oscem:Exposure_Time
  particle_index:
    description: Index of a particle inside a tomogram.
    range: integer
  source_region_id:
    description: ID of the region containing the source annotation used to extract this particle map.
    range: string
  source_annotation_id:
    description: ID of the source annotation used to extract this particle map.
    range: string
  coord_index:
    description: 0-based index of the coordinate inside the resolved source annotation.
    range: integer
  ctf_metadata:
    description: A set of CTF patameters for an image.
    range: CTFMetadata
  ctf_corrected:
    description: Flag to indicate if this was reconstructed from a tilt-series with the ctf corrected.
    range: boolean
  defocus_handedness:
    description: The handedness of the tilt geometry used to describe whether the focus increases or decreases
      as a function of Z distance.
    range: integer
  even_path:
    description: Path of the even file.
    range: string
  odd_path:
    description: Path of the odd file.
    range: string
classes:
  CTFMetadata:
    description: A set of CTF patameters for an image.
    slots:
    - defocus_u
    - defocus_v
    - defocus_angle
    - phase_shift
    - defocus_handedness
    slot_usage:
      defocus_handedness:
        ifabsent: -1
    attributes:
      fit_score:
        description: Optional native CTF-fit quality score; interpretation is software-specific.
        range: float
      fit_resolution:
        description: Optional native CTF-fit resolution limit in Angstrom.
        range: float
        minimum_value: 0
  AcquisitionMetadataMixin:
    description: Per-exposure acquisition metadata (varies from image to image).
    slots:
    - nominal_tilt_angle
    - accumulated_dose
    - ctf_metadata
    - exposure_time
    attributes:
      acquisition_order:
        description: Zero-based acquisition order, independent of storage order.
        range: integer
        minimum_value: 0
      exposure_dose:
        description: Exposure during this image in electrons per square Angstrom.
        range: float
        minimum_value: 0
  GainFile:
    is_a: Image2D
    description: A gain reference file.
    slots:
    - path
  DefectFile:
    is_a: Image2D
    description: A detector defect file.
    slots:
    - path
  MovieFrame:
    is_a: Image2D
    mixins:
    - AcquisitionMetadataMixin
    description: An individual movie frame
    slots:
    - path
    - section
    attributes:
      id:
        description: Optional stable identity; required when referenced by a movie alignment.
        range: string
      source_start_index:
        description: Zero-based first raw input frame integrated into this image.
        range: integer
        minimum_value: 0
      source_frame_count:
        description: Number of contiguous raw input frames integrated into this image.
        range: integer
        minimum_value: 1
  MovieStack:
    description: A stack of movie frames.
    slots:
    - id
    - path
    attributes:
      images:
        description: The movie frames in the stack
        range: MovieFrame
        multivalued: true
      alignments:
        description: ''
        range: MovieAlignment
        multivalued: true
        inlined_as_list: true
      raw_frame_count:
        description: Total raw input frames, including excluded frames.
        range: integer
        minimum_value: 1
    is_a: Image2D
  MovieStackSeries:
    description: A group of movie stacks that belong to a single tilt series.
    slots:
    - id
    attributes:
      stacks:
        description: The movie stacks.
        range: MovieStack
        multivalued: true
        inlined_as_list: true
      acquisition_session_id:
        description: The ID of the acquisition session this movie stack series was collected in.
        range: string
  BaseProjectionImage:
    is_a: Image2D
    mixins:
    - AcquisitionMetadataMixin
    description: Base class for different projection image types, not for direct use.
    abstract: true
    slots:
    - path
    - section
  ProjectionImage:
    is_a: BaseProjectionImage
    description: A projection image.
  SubProjectionImage:
    is_a: ProjectionImage
    description: A croppecd projection image.
    slots:
    - particle_index
  TiltImage:
    is_a: BaseProjectionImage
    description: A projection image that belongs to a tilt series.
    slots:
    - id
    attributes:
      movie_stack_id:
        description: The ID of the movie stack for this tilt image.
        range: string
  TiltSeries:
    description: A stack of projection images.
    slots:
    - id
    - path
    - ctf_corrected
    - even_path
    - odd_path
    attributes:
      images:
        description: The projections in the stack.
        range: TiltImage
        multivalued: true
        inlined_as_list: true
      movie_stack_series_id:
        description: The ID of the movie stack series for this tilt series.
        range: string
      acquisition_session_id:
        description: The ID of the acquisition session this tilt series was collected in.
        range: string
      defocus_handedness:
        description: Sign of the defocus contribution of positive beam-depth displacement; unknown is null.
        range: integer
        minimum_value: -1
        maximum_value: 1
      defocus_slope:
        description: Dimensionless multiplier of the signed geometric depth contribution.
        range: float
      nominal_tilt_axis_angle:
        description: Acquisition-stage tilt-axis angle in degrees, not a refined rotation.
        range: float
      collection_metadata_path:
        description: Optional acquisition metadata artifact path or URI.
        range: string
  Tomogram:
    is_a: Image3D
    description: A 3D tomogram.
    slots:
    - id
    - path
    - ctf_corrected
    - even_path
    - odd_path
    attributes:
      tilt_series_id:
        description: The ID of the tilt series for this tomogram.
        range: string
      alignment_id:
        description: Alignment that produced this reconstructed tomogram.
        range: string
      provenance:
        description: ''
        range: ProcessingProvenance
  ParticleMap:
    is_a: Image3D
    description: A 3D particle density map.
    slots:
    - path
    - source_region_id
    - source_annotation_id
    - coord_index
