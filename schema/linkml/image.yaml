name: CETMDImage
id: https://w3id.org/cetmd/image/
version: 0.0.1
description: Schema for cryoET alignments
prefixes:
  linkml: https://w3id.org/linkml/
  image: https://w3id.org/cetmd/image/

default_prefix: image

imports:
- linkml:types
- ./coordinate_systems

slots:
  width:
    description: The width of the image (x-axis) in pixels
    range: integer
  height:
    description: The height of the image (y-axis) in pixels
    range: integer
  depth:
    description: The depth of the image (z-axis) in pixels
    range: integer
  coordinate_systems:
    description: Named coordinate systems for this entity
    range: CoordinateSystem
    multivalued: true
  coordinate_transformations:
    description: Named coordinate transformations for this entity
    range: CoordinateTransformation
    multivalued: true

classes:
  Image2D:
    description: A 2D image.
    slots:
      - width
      - height
      - coordinate_systems
      - coordinate_transformations
    slot_usage:
      coordinate_transformations: &image_frame
        description: >-
          Named coordinate transformations for this image. The transformation
          named array_to_physical is the image frame. It maps the coordinate
          system named array (axes x, y and z by position, of type array, in
          pixel) to the one named physical (of type space, in angstrom). It is a
          Sequence of an optional Rot90, an optional Reflection, a Translation
          and a Scale, in that order and each at most once, so that
          physical = diag(scale) (F R index + translation). The translation is
          in pixels along the oriented axes, and the scale is the pixel or voxel
          spacing in angstrom along the final axes. A missing step means no
          rotation, no reflection, zero translation or unit spacing. Other named
          transformations are not restricted.
        comments:
          - >-
            The Python image models expose the frame as the translation and
            pixel_size or voxel_size properties. They also read a standalone
            Scale named array_to_physical, whose single factor applies to every
            axis, and always write the full Sequence.

  Image3D:
    description: A 3D image.
    slots:
      - width
      - height
      - depth
      - coordinate_systems
      - coordinate_transformations
    slot_usage:
      coordinate_transformations: *image_frame

  ImageStack2D:
    description: A stack of 2D images.
    attributes:
      images:
        description: The images in the stack
        range: Image2D
        multivalued: true

  ImageStack3D:
    description: A stack of 3D images.
    attributes:
      images:
        description: The images in the stack
        range: Image3D
        multivalued: true

