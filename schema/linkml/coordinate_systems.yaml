name: CETMDCoordinateSystems
id: https://w3id.org/cetmd/coordinate_systems
version: 0.0.1
description: Schema for cryoET alignments

prefixes:
  linkml: https://w3id.org/linkml/
  coordinate_systems: https://w3id.org/cetmd/coordinate_systems/

default_prefix: coordinate_systems

imports:
- linkml:types
- ./common

classes:
  Axis:
    description: An axis in a coordinate system
    slots:
      - name
    attributes:
      axis_unit:
        description: The unit of the axis
        range: AxisUnit
        ifabsent: AxisUnit(angstrom)
      axis_type:
        description: The type of axis
        range: AxisType

  CoordinateSystem:
    description: A coordinate system
    attributes:
      name:
        description: The name of the coordinate system. Free-form to allow per-entity /
          intermediate systems; the canonical values are enumerated by CoordinateSpaceName.
        range: string
        required: true
      axes:
        description: The axes of the coordinate system
        range: Axis
        required: true
        multivalued: true

enums:
  AxisType:
    description: The type of axis
    permissible_values:
      space:
        description: A spatial axis
      array:
        description: An array axis
  CoordinateSpaceName:
    description: Canonical names for an entity's standard coordinate systems.
    permissible_values:
      array:
        description: Discrete index space (integer pixel/voxel coordinates).
      physical:
        description: Continuous physical space in Ångström.
  AxisUnit:
    description: Allowable axis units.
    permissible_values:
      pixel:
        description: 2D array index unit.
      voxel:
        description: 3D array index unit.
      angstrom:
        description: Physical length in Ångström (the default).
      nanometer:
        description: Physical length in nanometers.
